services:
  kafka:
    image: confluentinc/cp-kafka:8.4.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9101:9101"
      - "9092:9092"
    env_file:
      - kafka/.env
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      start_period: 3s
      interval: 5s
      timeout: 5s
      retries: 3
  
  clickhouse:
    user: "${UID}:${GID}"
    image: clickhouse:26.10
    hostname: clickhouse
    container_name: clickhouse
    ports:
      - "18123:8123"
      - "19000:9000"
    env_file:
      - clickhouse/.env
    volumes:
      - ch-data:/var/lib/clickhouse/
      - ch-logs:/var/log/clickhouse-server/
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  
  producer:
    user: "${UID}:${GID}"
    build:
      dockerfile: producer/Dockerfile
    image: oxyiramus/rolling-anomalies-producer:latest
    container_name: producer
    env_file:
      - producer/.env
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
  ch-data:
  ch-logs: