[project]
name = "producer"
version = "0.0.0"
authors = [{name = "Екатерина Жданова", email = "zhdanova.ekaterina.95@yandex.ru"}]
requires-python = ">=3.14"
dependencies = [
    "gql[aiohttp]>=4.4.0",
    "confluent-kafka==2.16.1",
    "python-dotenv==1.2.4",
    "structlog>=26.1.0"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
